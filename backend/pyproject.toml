[project]
name = "llm-guardian-backend"
version = "0.1.0"
description = "Lightweight LLM monitoring backend for LLM-Guardian"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10.5,<4.0.0",
  "alembic>=1.13.2,<2.0.0",
  "apscheduler>=3.10.4,<4.0.0",
  "argon2-cffi>=23.1.0,<24.0.0",
  "cryptography>=43.0.1,<44.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "uvicorn[standard]>=0.31.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2,<1.0.0",
  "pytest>=8.3.3,<9.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
